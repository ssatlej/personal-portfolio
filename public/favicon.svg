<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Text Neon Blue Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#111827" stroke-width="12" />

  <!-- Outer Glow Outline -->
  <rect width="512" height="512" rx="110" fill="none" stroke="#22D3EE" stroke-width="6" opacity="0.25" />

  <!-- Letter S -->
  <text 
    x="50%" 
    y="54%" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Sora', 'Segoe UI', sans-serif" 
    font-size="320" 
    font-weight="800" 
    fill="url(#neonGrad)" 
    text-anchor="middle" 
    dominant-baseline="middle"
    filter="url(#glow)">
    S
  </text>
</svg>
